<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E232A"/><stop offset="1" stop-color="#15181D"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#68B2A0"/><stop offset="1" stop-color="#2C6975"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#68B2A0" stroke-opacity=".25" stroke-width="4"/>
  <!-- shackle, open on the right: the problem is claimed, the other side is locked out -->
  <path d="M176 236 V172 a80 80 0 0 1 160 0 V196" fill="none" stroke="#9FD3C5" stroke-width="34" stroke-linecap="round"/>
  <!-- body -->
  <rect x="120" y="222" width="272" height="206" rx="40" fill="url(#lock)"/>
  <!-- AC tick -->
  <path d="M196 326 l42 42 l82 -88" fill="none" stroke="#F8F8F8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- five problem pips -->
  <g fill="#F8F8F8">
    <circle cx="200" cy="404" r="7"/><circle cx="228" cy="404" r="7"/><circle cx="256" cy="404" r="7"/>
    <circle cx="284" cy="404" r="7" fill-opacity=".35"/><circle cx="312" cy="404" r="7" fill-opacity=".35"/>
  </g>
</svg>
